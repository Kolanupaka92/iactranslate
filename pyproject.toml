[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iactranslate"
version = "0.1.0"
description = "AI infrastructure migration translator: discovery reports -> production-ready Terraform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "IaCTranslate" }]
dependencies = [
    "pydantic>=2.5,<3",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
# Encryption at rest for uploaded inventory (ADR 0043). Optional because
# `cryptography` is a compiled dependency and the tool must stay installable
# anywhere; enable by setting IACTRANSLATE_ENCRYPTION_KEY.
encryption = ["cryptography>=42.0"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "anthropic>=0.39",
    "ruff>=0.6",
    "hypothesis>=6.100",  # property-based tests (tests/test_properties.py)
    "cryptography>=42.0",  # tests/test_crypto.py exercises encryption at rest
    "markdown>=3.5",  # scripts/build_guide_artifact.py (docs → HTML for the Artifact)
    "pip-audit>=2.7",  # dependency vulnerability gate (CI `security` job)
    "bandit[toml]>=1.7",  # static security analysis (CI `security` job)
]

[project.scripts]
iactranslate = "iactranslate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iactranslate = ["targets/*/templates/*.j2", "samples/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
# B008: FastAPI uses callables (Depends/UploadFile) as arg defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# These modules embed self-contained HTML/CSS templates; wrapping inline CSS/HTML
# to satisfy the line limit hurts readability more than it helps.
"src/iactranslate/assessment/report.py" = ["E501"]
"src/iactranslate/exec_report.py" = ["E501"]
"src/iactranslate/diagram.py" = ["E501"]


[tool.bandit]
# Scan `src` only: `tests` deliberately exercises hostile input and asserts on
# weak/unsafe constructs, so scanning it produces findings that are the point of
# the test rather than defects.
exclude_dirs = ["tests", "web", "scripts"]
