[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iactranslate"
version = "0.1.0"
description = "AI infrastructure migration translator: discovery reports -> production-ready Terraform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "IaCTranslate" }]
dependencies = [
    "pydantic>=2.5,<3",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "anthropic>=0.39",
]

[project.scripts]
iactranslate = "iactranslate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iactranslate = ["generator/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
