[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iactranslate"
version = "0.1.0"
description = "AI infrastructure migration translator: discovery reports -> production-ready Terraform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "IaCTranslate" }]
dependencies = [
    "pydantic>=2.5,<3",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "anthropic>=0.39",
    "ruff>=0.6",
    "markdown>=3.5",  # scripts/build_guide_artifact.py (docs → HTML for the Artifact)
]

[project.scripts]
iactranslate = "iactranslate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iactranslate = ["targets/*/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
# B008: FastAPI uses callables (Depends/UploadFile) as arg defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# These modules embed self-contained HTML/CSS templates; wrapping inline CSS/HTML
# to satisfy the line limit hurts readability more than it helps.
"src/iactranslate/assessment/report.py" = ["E501"]
"src/iactranslate/exec_report.py" = ["E501"]
"src/iactranslate/diagram.py" = ["E501"]
