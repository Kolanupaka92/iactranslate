# Dependency updates. Without this, the ">=" ranges in pyproject.toml drift
# silently: CI resolves whatever is newest at build time, so a compromised or
# vulnerable release lands with no PR, no review, and no record.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patches — dozens of individual bumps get ignored,
      # and an ignored dependency PR is the same as not having Dependabot.
      python-patch:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Majors held back on purpose, each until its condition changes. Without
    # these, the closed PRs come back every week and train people to ignore
    # Dependabot, which is the failure the grouping above exists to prevent.
    ignore:
      # Type definitions must match the Node runtime major (CI and the
      # deployment run Node 20); newer ones type-check calls to APIs that do
      # not exist at runtime. Bump together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) supports TypeScript
      # >=4.8.4 <6.1.0. Revisit when it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-config-next bundles eslint-plugin-react, -import and -jsx-a11y,
      # which stop at ESLint 9. Revisit when eslint-config-next supports 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
