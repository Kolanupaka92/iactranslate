name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate test fixtures
        run: python scripts/make_fixtures.py

      - name: Run tests
        run: pytest -q

  terraform-validate:
    # Prove the generated Terraform is genuinely valid against the real
    # AWS / azurerm / google providers — not just shape-checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate test fixtures
        run: python scripts/make_fixtures.py
      - name: Validate generated Terraform (aws/azure/gcp)
        env:
          IACTRANSLATE_E2E_TOFU: "1"
          TF_PLUGIN_CACHE_DIR: /tmp/tf-plugin-cache
        run: |
          mkdir -p /tmp/tf-plugin-cache
          pytest tests/test_e2e.py::test_generated_terraform_validates -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t iactranslate:ci .
      - name: Smoke-test container health
        run: |
          docker run -d --name iac -p 8000:8000 iactranslate:ci
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then echo " OK"; exit 0; fi
            sleep 1
          done
          echo "health check failed"; docker logs iac; exit 1
      - name: Smoke-test server-side PDF rendering
        # The one place PDF rendering can actually be exercised: WeasyPrint needs
        # Pango and Cairo, which the image installs and a developer laptop
        # usually does not. Verifies a real PDF comes out, not just that the
        # import succeeded.
        run: |
          docker run --rm iactranslate:ci python -c "
          from iactranslate import pdf
          assert pdf.available(), 'weasyprint should be importable in the image'
          from iactranslate.normalize import normalize
          from iactranslate.parsers import parse
          from iactranslate.agents import build_migration_plan
          from iactranslate.targets import get_target
          from iactranslate.exec_report import build_executive_report
          from iactranslate.cli import sample_estate_path
          vms = normalize(parse(str(sample_estate_path())))
          plan = build_migration_plan(vms, 'ci', get_target('aws'))
          out = pdf.render(build_executive_report(plan, vms))
          assert out.startswith(b'%PDF-'), out[:20]
          assert len(out) > 5000, len(out)
          print('rendered', len(out), 'byte PDF')
          "

      - name: Smoke-test encryption and the PostgreSQL driver
        # Both are optional extras of the library and mandatory in the image: a
        # hosted deployment sets IACTRANSLATE_ENCRYPTION_KEY, and without
        # `cryptography` the API fails closed and refuses every upload (ADR
        # 0043) — correct behaviour, useless deployment. That shipped once and
        # was only caught by a smoke test against the real service.
        run: |
          docker run --rm -e IACTRANSLATE_ENCRYPTION_KEY=zZ8kQ2mVv1sB4nR7tY0uX3wC6eA9gJ5hK8lN1pS4dF0= \
            iactranslate:ci python -c "
          from iactranslate.crypto import encryption_enabled, encrypt_bytes, decrypt_bytes
          assert encryption_enabled(), 'cryptography must be installed in the image'
          assert decrypt_bytes(encrypt_bytes(b'estate')) == b'estate'
          import psycopg, psycopg_pool  # noqa: F401 — the postgres backend needs both
          print('encryption and psycopg both available')
          "

      - name: Smoke-test the zero-input demo
        # The path a first-time evaluator takes: no inventory, no account,
        # no upload. If this breaks, nobody can try the product.
        run: |
          docker run --rm iactranslate:ci iactranslate demo --out /tmp/demo \
            | tee /tmp/demo.log
          grep -q "Nothing is uploaded" /tmp/demo.log

  redis-integration:
    # The shared rate limiter is verified against `fakeredis` in the main suite so
    # it runs offline. This job repeats those tests against a real Redis, because
    # the Lua script, server-side TIME and TTL semantics are exactly what a
    # reimplementation can get subtly wrong — and the limiter's correctness rests
    # on them.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,redis]"
      - name: Shared rate limiting against a real Redis
        env:
          IACTRANSLATE_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_ratelimit_shared.py -v

  postgres-integration:
    # The stores are covered against SQLite in the main suite, which is the
    # default engine and covers the logic. It cannot cover what actually breaks
    # when the engine is swapped: placeholder binding, type mapping, schema
    # introspection and the job-queue claim. Those are only meaningful against a
    # real server, so this runs them against one.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iactranslate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Durable stores against a real PostgreSQL
        env:
          IACTRANSLATE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/iactranslate
        run: pytest tests/test_postgres_store.py -v

  security:
    # Supply-chain gate. Enterprise procurement asks for an SBOM and a
    # vulnerability report in the first security review; before this job there
    # was no answer to either, while the project published a public image.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # `upload-sarif` reads the workflow run to fingerprint results and
      # deduplicate alerts. Without this it fails with "Resource not accessible
      # by integration" *after* the scan has already succeeded — so the job goes
      # red for a reporting permission rather than for anything it found.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit bandit[toml]

      - name: Audit dependencies for known vulnerabilities
        # Fails the build (exit 1) on any known-vulnerable dependency — the check
        # that catches a compromised or outdated transitive package.
        #
        # `--skip-editable` excludes iactranslate itself, which is installed with
        # `-e` and is not on PyPI, so it cannot be looked up. `--strict` is
        # deliberately omitted because it treats that unauditable local package
        # as a failure; vulnerabilities still fail the run without it.
        run: pip-audit --skip-editable --progress-spinner=off

      - name: Static security analysis
        # Bandit finds the classes ruff does not: subprocess misuse, weak
        # hashes, hardcoded secrets, unsafe deserialization.
        run: bandit -r src -ll -f screen

      - name: Build image for scanning
        run: docker build -t iactranslate:scan .

      - name: Scan image for OS and library CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iactranslate:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Without this the SARIF carries every severity regardless of the
          # filter above, burying the findings that gate the build.
          limit-severities-for-sarif: true

      - name: Upload scan results
        # Reporting, not gating — the enforcement is the step below, which
        # already fails the build on fixable CRITICAL/HIGH findings.
        #
        # Tolerated because it needs GitHub code scanning enabled on the
        # repository, and it is not. That turned a switched-off reporting
        # feature into a red security job, which is the worst way for this job
        # to fail: it looks exactly like a vulnerability and is not one, and it
        # teaches everyone to stop believing the job.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Fail on fixable CRITICAL/HIGH findings
        # Reported to the Security tab above *and* enforced here — a report
        # nobody is required to read is not a control.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iactranslate:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: iactranslate:scan
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Publish SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  publish-image:
    # Publish only from main, so anyone can `docker run` it without cloning.
    needs: [lint, test, docker, web, terraform-validate, security, redis-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless signing via the OIDC token
      attestations: write  # SLSA build provenance
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        # GHCR rejects uppercase repository names, and github.repository
        # preserves the owner's casing.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Sign the image (keyless)
        # Anyone can now verify this image really came from this workflow in
        # this repository, rather than trusting that whatever is at :latest is
        # what we built. No long-lived signing key exists to leak.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Attest build provenance (SLSA)
        # GitHub refuses attestations for user-owned *private* repositories, and
        # this repository is now private. The image is still built, pushed and
        # keyless-signed with cosign in the step above — signing proves origin,
        # which is the property that matters most here. Provenance attestation
        # is the stronger claim and is simply unavailable on this plan, so this
        # is a missing feature rather than a weakened one.
        #
        # Remove `continue-on-error` if the repository goes public again; the
        # attestation will start working with no other change.
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
