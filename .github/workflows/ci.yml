name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate test fixtures
        run: python scripts/make_fixtures.py

      - name: Run tests
        run: pytest -q

  terraform-validate:
    # Prove the generated Terraform is genuinely valid against the real
    # AWS / azurerm / google providers — not just shape-checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate test fixtures
        run: python scripts/make_fixtures.py
      - name: Validate generated Terraform (aws/azure/gcp)
        env:
          IACTRANSLATE_E2E_TOFU: "1"
          TF_PLUGIN_CACHE_DIR: /tmp/tf-plugin-cache
        run: |
          mkdir -p /tmp/tf-plugin-cache
          pytest tests/test_e2e.py::test_generated_terraform_validates -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t iactranslate:ci .
      - name: Smoke-test container health
        run: |
          docker run -d --name iac -p 8000:8000 iactranslate:ci
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then echo " OK"; exit 0; fi
            sleep 1
          done
          echo "health check failed"; docker logs iac; exit 1
      - name: Smoke-test the zero-input demo
        # The path a first-time evaluator takes: no inventory, no account,
        # no upload. If this breaks, nobody can try the product.
        run: |
          docker run --rm iactranslate:ci iactranslate demo --out /tmp/demo \
            | tee /tmp/demo.log
          grep -q "Nothing is uploaded" /tmp/demo.log

  security:
    # Supply-chain gate. Enterprise procurement asks for an SBOM and a
    # vulnerability report in the first security review; before this job there
    # was no answer to either, while the project published a public image.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit bandit[toml]

      - name: Audit dependencies for known vulnerabilities
        # Fails the build (exit 1) on any known-vulnerable dependency — the check
        # that catches a compromised or outdated transitive package.
        #
        # `--skip-editable` excludes iactranslate itself, which is installed with
        # `-e` and is not on PyPI, so it cannot be looked up. `--strict` is
        # deliberately omitted because it treats that unauditable local package
        # as a failure; vulnerabilities still fail the run without it.
        run: pip-audit --skip-editable --progress-spinner=off

      - name: Static security analysis
        # Bandit finds the classes ruff does not: subprocess misuse, weak
        # hashes, hardcoded secrets, unsafe deserialization.
        run: bandit -r src -ll -f screen

      - name: Build image for scanning
        run: docker build -t iactranslate:scan .

      - name: Scan image for OS and library CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: iactranslate:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Fail on fixable CRITICAL/HIGH findings
        # Reported to the Security tab above *and* enforced here — a report
        # nobody is required to read is not a control.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: iactranslate:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: iactranslate:scan
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Publish SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  publish-image:
    # Publish only from main, so anyone can `docker run` it without cloning.
    needs: [lint, test, docker, web, terraform-validate, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless signing via the OIDC token
      attestations: write  # SLSA build provenance
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        # GHCR rejects uppercase repository names, and github.repository
        # preserves the owner's casing.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Sign the image (keyless)
        # Anyone can now verify this image really came from this workflow in
        # this repository, rather than trusting that whatever is at :latest is
        # what we built. No long-lived signing key exists to leak.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
