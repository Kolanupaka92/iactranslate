name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate test fixtures
        run: python scripts/make_fixtures.py

      - name: Run tests
        run: pytest -q

  terraform-validate:
    # Prove the generated Terraform is genuinely valid against the real
    # AWS / azurerm / google providers — not just shape-checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate test fixtures
        run: python scripts/make_fixtures.py
      - name: Validate generated Terraform (aws/azure/gcp)
        env:
          IACTRANSLATE_E2E_TOFU: "1"
          TF_PLUGIN_CACHE_DIR: /tmp/tf-plugin-cache
        run: |
          mkdir -p /tmp/tf-plugin-cache
          pytest tests/test_e2e.py::test_generated_terraform_validates -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t iactranslate:ci .
      - name: Smoke-test container health
        run: |
          docker run -d --name iac -p 8000:8000 iactranslate:ci
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then echo " OK"; exit 0; fi
            sleep 1
          done
          echo "health check failed"; docker logs iac; exit 1
      - name: Smoke-test the zero-input demo
        # The path a first-time evaluator takes: no inventory, no account,
        # no upload. If this breaks, nobody can try the product.
        run: |
          docker run --rm iactranslate:ci iactranslate demo --out /tmp/demo \
            | tee /tmp/demo.log
          grep -q "Nothing is uploaded" /tmp/demo.log

  publish-image:
    # Publish only from main, so anyone can `docker run` it without cloning.
    needs: [lint, test, docker, web, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
